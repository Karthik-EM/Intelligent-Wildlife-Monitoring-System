<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentryNet - Sensor Status</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
       /* ========== GLOBAL & NAVIGATION (Shared) ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Space Grotesk', sans-serif; 
            background: #f8f6f1; 
            min-height: 100vh; 
            overflow-x: hidden; 
        }
        .hidden { display: none !important; }

        /* Navigation */
        .mode-selector {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
            z-index: 10000; display: flex; align-items: center; gap: 15px;
            padding-bottom: 10px; font-size: 0.9rem; font-weight: 700; letter-spacing: 0.15em;
            text-transform: uppercase; mix-blend-mode: multiply; background: rgba(248, 246, 241, 0.9); padding: 10px 20px; border-radius: 50px;
        }
        .mode-link {
            background: none; border: none; padding: 0; margin: 0; cursor: pointer;
            font-family: inherit; font-size: inherit; font-weight: inherit;
            letter-spacing: inherit; text-transform: inherit; outline: none;
            color: #b0b0b0; transition: all 0.4s ease; position: relative;
            text-decoration: none;
        }
        .mode-link:hover { color: #666; }
        .mode-link.active { color: #1a1a1a; transform: scale(1.05); }
        .mode-link.active::after {
            content: ''; position: absolute; bottom: -6px; left: 50%;
            transform: translateX(-50%); width: 4px; height: 4px;
            background: #e53935; border-radius: 50%;
        }
        .divider { color: #ddd; font-weight: 400; user-select: none; }

        /* ========== SENSOR DASHBOARD LAYOUT ========== */
        #view-research {
            font-family: 'Space Grotesk', sans-serif;
            background: #f8f6f1;
            color: #1a1a1a;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            padding: 80px 1.5vw 1.5vh 1.5vw;
            display: flex;
            justify-content: center;
        }

        .dashboard-wrapper {
            width: 100%;
            max-width: 1500px;
            height: 100%;
            display: grid;
            grid-template-columns: 2.5fr 1fr;
            gap: 1.5rem;
            opacity: 0;
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn { to { opacity: 1; } }

        /* Left Panel */
        .sensor-panel { display: flex; flex-direction: column; gap: 1rem; height: 100%; }
        
        /* Command Center Header */
        .header-area { display: flex; justify-content: space-between; align-items: center; background: white; padding: 0.8rem 1.2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); flex-shrink: 0; }
        .brand h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
        .brand p { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 2px; }
        .global-status { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; font-weight: 700; color: #555; background: #f8f6f1; padding: 0.4rem 0.8rem; border-radius: 50px; }

        /* --- NEW NODE LAYOUT --- */
        .node-container {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            flex: 1;
        }

        /* Node Header Inline Layout */
        .node-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding-bottom: 1rem;
            border-bottom: 2px solid #f0f0f0;
        }

        .node-title-area {
            display: flex;
            align-items: stretch;
            gap: 12px;
        }

        .node-indicator-bar {
            width: 4px;
            background: #e53935;
            border-radius: 4px;
        }

        .node-titles h2 {
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #1a1a1a;
            margin-bottom: 6px;
        }

        .node-stats {
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
            color: #888;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .node-stats strong {
            color: #333;
        }

        .node-status-dot {
            width: 12px;
            height: 12px;
            background: #ccc;
            border-radius: 50%;
            margin-top: 5px;
            box-shadow: 0 0 0 rgba(0,0,0,0);
            transition: all 0.3s ease;
        }

        /* 3-Column Sensor Grid */
        .sensor-grid-row { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); /* Changed to 3 columns to perfectly fit the remaining cards */
            gap: 1rem; 
            flex: 1;
        }

        .card { 
            background: #fdfdfd; 
            border-radius: 10px; 
            padding: 1.5rem; 
            border: 2px solid #eaeaea; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .card-label { 
            font-size: 0.8rem; 
            text-transform: uppercase; 
            color: #888; 
            font-weight: 700; 
            letter-spacing: 0.05em; 
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        
        .card-icon { font-size: 1.4rem; }
        .card-value { font-size: 2.2rem; font-weight: 700; line-height: 1; color: #1a1a1a; }

        /* Right Panel (Logs) */
        .log-panel { background: white; border-radius: 12px; padding: 1.2rem; display: flex; flex-direction: column; box-shadow: 0 4px 20px rgba(0,0,0,0.04); height: 100%; overflow: hidden; }
        .log-title { font-size: 1rem; font-weight: 700; margin-bottom: 0.8rem; display: flex; justify-content: space-between; align-items: center; }
        .live-indicator { font-size: 0.7rem; color: #e53935; animation: blink 2s infinite; font-weight: 700; }
        @keyframes blink { 50% { opacity: 0.5; } }
        .log-feed { flex: 1; overflow-y: auto; padding-right: 5px; display: flex; flex-direction: column; gap: 0.6rem; }
        .log-entry { padding: 0.6rem; background: #fcfcfc; border-radius: 6px; border-left: 3px solid #ddd; font-size: 0.85rem; animation: slideInLeft 0.3s ease-out; }
        @keyframes slideInLeft { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
        .log-time { display: block; font-size: 0.7rem; color: #999; margin-bottom: 2px; font-family: monospace; }
        .log-msg { font-weight: 600; color: #333; line-height: 1.3; }

        /* Sensor Status Colors */
        .status-ok { border-color: #43a047; background: #f4fbf5;} .status-ok .card-value { color: #43a047; }
        .status-warn { border-color: #fb8c00; background: #fffbf0; } .status-warn .card-value { color: #e65100; }
        .status-danger { border-color: #e53935; background: #fff5f5; } .status-danger .card-value { color: #c62828; }
        .status-offline { border-color: #90a4ae; opacity: 0.8; background: #f5f5f5; }
        .log-ok { border-left-color: #43a047; }
        .log-warn { border-left-color: #fb8c00; background: #fffcf0; }
        .log-danger { border-left-color: #e53935; background: #fff5f5; }

        .dot { width: 8px; height: 8px; background: #ccc; border-radius: 50%; position: relative; }
        .dot.active::after { content:''; position: absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:100%; height:100%; border:2px solid currentColor; border-radius:50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform:translate(-50%,-50%) scale(0.8); opacity:0.8; } 100% { transform:translate(-50%,-50%) scale(2.5); opacity:0; } }
        
        /* ========== WAKE BUTTON STYLES ========== */
        .btn-wake {
            padding: 8px 20px;
            background: #1a1a1a;
            color: #fff;
            border: 2px solid #1a1a1a;
            border-radius: 50px;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            outline: none;
        }
        .btn-wake:hover { background: #333; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.15); }
        .btn-wake:active { transform: translateY(2px) scale(0.95); box-shadow: inset 0 4px 8px rgba(0,0,0,0.4); background: #000; }
        .btn-wake.loading { background: #666; border-color: #666; pointer-events: none; transform: none; box-shadow: none; }  
    </style>
</head>

<body>
    
<div class="mode-selector">
    <a href="{{ url_for('index') }}" class="mode-link">Research</a>
    <span class="divider">//</span>
    <a href="{{ url_for('sen') }}" class="mode-link active">Sensor Status</a>
    <span class="divider">//</span>
    <a href="{{ url_for('amb82_analysis') }}" class="mode-link">Video Analysis</a>
    <span class="divider">//</span>
    <a href="{{ url_for('analytics') }}" class="mode-link">Analytics</a> 
    <span class="divider">//</span>
    <a href="{{ url_for('settings') }}" class="mode-link ">Settings</a> 
</div>

<div id="view-research">
    <div class="dashboard-wrapper">
        
        <div class="sensor-panel">
            <div class="header-area">
                <div class="brand">
                    <h1>SentryNet</h1>
                    <p>Command Center</p>
                </div>
                
                <button id="wakeBtn" class="btn-wake" onclick="wakeCamera()">
                    <span>📷</span> Wake Camera
                </button>
                
                <div class="global-status">
                    <div class="dot" id="global-dot"></div>
                    <span id="global-text">Initializing...</span>
                </div>
            </div>

            <div class="node-container">
                
                <div class="node-header">
                    <div class="node-title-area">
                        <div class="node-indicator-bar" id="node-bar"></div>
                        <div class="node-titles">
                            <h2>NODE 01: BASE STATION</h2>
                            <div class="node-stats">
                                <span>LINK: <strong id="val-link">WAITING</strong></span>
                                <span>RSSI: <strong id="val-rssi">--</strong></span>
                                <span>TEMP: <strong id="val-temp">--</strong></span>
                            </div>
                        </div>
                    </div>
                    <div class="node-status-dot" id="node-dot"></div>
                </div>

                <div class="sensor-grid-row">
                    
                    <div id="tiltBox" class="card">
                        <div class="card-label">
                            <span class="card-icon">📐</span>
                            TILT / TAMPER
                        </div>
                        <div class="card-value">--°</div>
                    </div>

                    <div id="motionBox" class="card">
                        <div class="card-label">
                            <span class="card-icon">🏃</span>
                            PIR MOTION
                        </div>
                        <div class="card-value">--</div>
                    </div>

                    <div id="gunshotBox" class="card">
                        <div class="card-label">
                            <span class="card-icon" style="color: #c62828;">🛡️</span>
                            ACOUSTIC
                        </div>
                        <div class="card-value">--</div>
                    </div>

                </div>
            </div>
        </div>

        <div class="log-panel">
            <div class="log-title">
                <span>Event Feed</span>
                <span class="live-indicator">● LIVE</span>
            </div>
            <div class="log-feed" id="log-feed">
            </div>
        </div>

    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>

<script>
    // ==========================================
    // SENSOR LOGIC
    // ==========================================
    let lastOnlineState = null;
    let lastGunshot = 0;
    let lastMotion = 0;
    let lastTiltHigh = false;

    // --- UI Helpers ---
    function updateCard(id, state, value) {
        const card = document.getElementById(id);
        if (!card) return; 

        const valEl = card.querySelector('.card-value');
        
        card.classList.remove('status-ok', 'status-warn', 'status-danger', 'status-offline');
        if(state) card.classList.add(`status-${state}`);
        if(valEl) valEl.textContent = value;
    }
    
    function addLog(msg, type, customTime = null) {
        const feed = document.getElementById('log-feed');
        if (!feed) return;

        const div = document.createElement('div');
        div.className = `log-entry log-${type}`;
        
        const dateObj = customTime ? new Date(customTime) : new Date();
        const dateStr = dateObj.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        const timeStr = dateObj.toLocaleTimeString('en-US', { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
        
        div.innerHTML = `
            <span class="log-time">${dateStr} • ${timeStr}</span>
            <span class="log-msg">${msg}</span>
        `;
        
        feed.prepend(div);
        if(feed.children.length > 50) feed.lastElementChild.remove();
    }

    // --- Main Update Loop ---
    function processLiveData(data) {
        try {
            const globalDot = document.getElementById('global-dot');
            const gText = document.getElementById('global-text');
            
            // Node specific DOM elements
            const nodeBar = document.getElementById('node-bar');
            const nodeDot = document.getElementById('node-dot');
            const valLink = document.getElementById('val-link');
            const valRssi = document.getElementById('val-rssi');
            const valTemp = document.getElementById('val-temp');

            // 1. Connection Logic & Header Data
            if (data.esp_online) {
                if (lastOnlineState === false) addLog("Connection restored", "ok");
                lastOnlineState = true;
                
                // Global Header Updates
                globalDot.style.backgroundColor = '#00e676'; 
                globalDot.style.boxShadow = '0 0 10px #00e676';
                gText.textContent = "System Nominal"; 
                gText.style.color = '#00e676';

                // Node Header Updates
                nodeBar.style.backgroundColor = '#00e676';
                nodeDot.style.backgroundColor = '#00e676';
                nodeDot.style.boxShadow = '0 0 10px #00e676';
                valLink.textContent = "STABLE";
                valLink.style.color = "#00e676";
                
                const temp = (data.temp !== null && data.temp !== undefined) ? Number(data.temp).toFixed(1) + "°C" : "--";
                const rssi = (data.rssi !== null && data.rssi !== undefined) ? data.rssi + "dBm" : "--";
                valRssi.textContent = rssi;
                valTemp.textContent = temp;

                // 2. Tilt Sensor
                const angle = Number(data.tilt || 0);
                if (Math.abs(angle) > 30) {
                    updateCard('tiltBox', 'warn', angle.toFixed(1) + "°");
                    if(!lastTiltHigh) addLog(`Tilt Alert: ${angle.toFixed(1)}°`, "warn");
                    lastTiltHigh = true;
                } else {
                    updateCard('tiltBox', 'ok', angle.toFixed(1) + "°");
                    lastTiltHigh = false;
                }

                // 3. Motion Sensor
                const motion = Number(data.motion || 0);
                if (motion === 1) {
                    updateCard('motionBox', 'warn', 'DETECTED');
                    if(lastMotion === 0) {
                        addLog("Motion detected at perimeter", "warn");
                        gText.textContent = "Activity Detected"; 
                        gText.style.color = "#ffab00";
                        globalDot.style.backgroundColor = "#ffab00";
                    }
                } else {
                    updateCard('motionBox', 'ok', 'CLEAR');
                }
                lastMotion = motion;

                // 4. Gunshot Sensor (Critical)
                const gunshot = Number(data.gunshot || 0);
                if (gunshot === 1) {
                    updateCard('gunshotBox', 'danger', 'DETECTED');
                    if(lastGunshot === 0) {
                        addLog("CRITICAL: GUNSHOT DETECTED", "danger");
                        gText.textContent = "SECURITY ALERT"; 
                        gText.style.color = "#ff1744";
                        globalDot.style.backgroundColor = "#ff1744";
                        globalDot.style.boxShadow = '0 0 20px #ff1744';
                    }
                } else {
                    updateCard('gunshotBox', 'ok', 'SAFE');
                }
                lastGunshot = gunshot;

            } else {
                // --- Offline Mode ---
                if(lastOnlineState === true) addLog("Lost connection to ESP32", "danger");
                lastOnlineState = false;
                
                // Global UI Reset
                globalDot.style.backgroundColor = '#546e7a'; 
                globalDot.style.boxShadow = 'none';
                gText.textContent = "Device Offline"; 
                gText.style.color = '#546e7a';

                // Node UI Reset
                nodeBar.style.backgroundColor = '#546e7a';
                nodeDot.style.backgroundColor = '#546e7a';
                nodeDot.style.boxShadow = 'none';
                valLink.textContent = "OFFLINE";
                valLink.style.color = "#546e7a";
                valRssi.textContent = "--";
                valTemp.textContent = "--";

                updateCard('tiltBox', 'offline', '--');
                updateCard('motionBox', 'offline', '--');
                updateCard('gunshotBox', 'offline', '--');
            }

        } catch (e) {
            console.error(e);
        }
    }

    // --- Send WAKE Command to Backend ---
    async function wakeCamera() {
        const btn = document.getElementById('wakeBtn');
        const originalHTML = '<span>📷</span> Wake Camera';
        
        try {
            btn.classList.add('loading');
            btn.innerHTML = '<span>⏳</span> Sending...';
            addLog("Sending manual wake command...", "ok");
            
            const res = await fetch('/api/command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: 'WAKE' })
            });
            const data = await res.json();
            if(!data.success) throw new Error(data.error);

            btn.innerHTML = '<span>✅</span> Sent!';
            
        } catch (e) {
            console.error(e);
            addLog("Failed to send wake command", "danger");
            btn.innerHTML = '<span>❌</span> Failed';
        }

        setTimeout(() => {
            btn.classList.remove('loading');
            btn.innerHTML = originalHTML;
        }, 2000);
    }

    // --- Load History from Database ---
    async function loadLogHistory() {
        try {
            const res = await fetch("/api/sensor_history");
            const data = await res.json();
            
            if (data.success && data.events) {
                const reversedEvents = data.events.reverse();
                reversedEvents.forEach(event => {
                    let msg = ""; let type = "ok";
                    if (event.type === "motion") { msg = "Motion detected at perimeter"; type = "warn"; } 
                    else if (event.type === "tilt") { msg = `Tilt Alert: ${Number(event.value).toFixed(1)}°`; type = "warn"; } 
                    else if (event.type === "gunshot") { msg = "CRITICAL: GUNSHOT DETECTED"; type = "danger"; } 
                    else if (event.type === "system" && event.value === 1.0) { msg = "Camera manually awakened"; type = "ok"; }
                    addLog(msg, type, event.timestamp);
                });
            }
        } catch (e) { console.error("Failed to load history:", e); }
    }

    // ==========================================
    // WEBSOCKET INITIALIZATION
    // ==========================================
    const socket = io();

    socket.on('sensor_update', function(data) {
        processLiveData(data);
    });

    socket.on('disconnect', function() {
        processLiveData({ esp_online: false });
        addLog("Disconnected from Central Server", "danger");
    });

    socket.on('connect', function() {
        addLog("Connected to Central Server via WebSockets", "ok");
    });

    loadLogHistory().then(() => {
        addLog("History loaded. Waiting for live telemetry...", "ok");
    });
</script>
</body>
</html>
